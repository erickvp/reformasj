name: Post Diario Redes Sociais

on:
  schedule:
    # Executa todos os dias às 23:00 UTC (20:00 Horário de Brasília)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      rede:
        description: 'Rede social para postagem (todas ou threads)'
        required: false
        default: 'todas'
        type: choice
        options:
          - todas
          - threads

permissions:
  contents: write

jobs:
  publicar-diario:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests tweepy atproto beautifulsoup4

      - name: Executar post diario das 20h
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.rede }}" = "threads" ]; then
            python postar_redes.py --modo diario --threads
          else
            python postar_redes.py --modo diario
          fi

      - name: Salvar estado_redes.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add estado_redes.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto: registro do post diario atualizado [skip ci]"
            git push
          else
            echo "Nenhuma alteracao de estado registrada."
          fi
