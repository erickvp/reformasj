name: Atualizar Noticias Diarias

on:
  schedule:
    # Executa duas vezes por dia: 12:00 UTC (09:00 Brasília) e 21:00 UTC (18:00 Brasília)
    - cron: '0 12,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rodar-coletor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install feedparser requests tweepy atproto beautifulsoup4 googlenewsdecoder

      - name: Executar script coletor de noticias
        run: python atualizar_noticias.py

      - name: Publicar novas noticias nas redes sociais
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python postar_redes.py --modo noticias

      - name: Salvar noticias.json e estado_redes.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias.json estado_redes.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto: noticias e redes atualizadas [skip ci]"
            git push
          else
            echo "Nenhuma novidade encontrada hoje."
          fi
