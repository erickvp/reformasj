name: Atualizar Noticias Diarias

on:
  schedule:
    # Executa todos os dias às 21:00 UTC (18:00 no horário de Brasília)
    - cron: '0 14,22 * * *'
  workflow_dispatch: # Permite que você rode manualmente clicando em um botão

permissions:
  contents: write

jobs:
  rodar-coletor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar biblioteca feedparser
        run: |
          pip install feedparser

      - name: Executar script coletor
        run: |
          python atualizar_noticias.py

      - name: Salvar noticias.json atualizado
        run: |
          git config --global user.name "Bot Sao Januario"
          git config --global user.email "actions@github.com"
          git add noticias.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: noticias atualizadas [skip ci]" && git push)
