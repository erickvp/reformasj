name: Atualizar Noticias Diarias

on:
  schedule:
    - cron: '0 14,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar feedparser
        run: pip install feedparser

      - name: Rodar coletor
        run: python atualizar_noticias.py

      - name: Salvar alteracoes no repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto: noticias atualizadas [skip ci]"
            git push
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
