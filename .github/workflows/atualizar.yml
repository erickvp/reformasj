name: Atualizar Noticias Diarias

on:
  schedule:
    - cron: '0 14,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rodar-coletor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar feedparser
        run: pip install feedparser

      - name: Executar script coletor
        run: python atualizar_noticias.py

      - name: Salvar noticias.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto: noticias atualizadas [skip ci]"
            git push
          else
            echo "Nenhuma novidade hoje."
          fi
